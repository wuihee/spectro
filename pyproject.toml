[project]
name = "spectro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "wuihee", email = "wuihee@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pybaselines>=1.2.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "pymarkdownlnt>=0.9.41",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 88
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "UP",      # modern Python syntax
    "B",       # likely bugs
    "NPY",     # numpy-specific checks
    "D",       # docstrings (pydocstyle)
]
ignore = [
    "D105",  # magic methods like __len__ need no docstring
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]          # test names say what they check
"notebooks/*" = ["D", "E402"]  # markdown cells document notebooks

[tool.pymarkdown]
extensions.markdown-tables.enabled = true
plugins.md013.line_length = 88          # match ruff
plugins.md013.heading_line_length = 88
plugins.md013.tables = false            # table rows can't be wrapped
plugins.md013.code_blocks = false       # ASCII pipeline diagrams
plugins.md024.siblings_only = true      # each STUDY.md step repeats "Read", "Try", ...
plugins.md033.allowed_elements = "details,summary"  # folded answers in STUDY.md
